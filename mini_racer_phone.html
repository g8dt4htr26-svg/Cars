<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini Racer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10141c;color:#fff;font-family:system-ui;touch-action:none}
main{height:100dvh;display:flex;flex-direction:column;align-items:center;gap:9px;padding:10px}
header{width:min(100%,420px);display:flex;justify-content:space-between;font-weight:800}
canvas{width:min(100%,420px);height:min(70dvh,680px);border:2px solid #394353;border-radius:14px;background:#242a33}
.controls{width:min(100%,420px);display:flex;gap:10px}
button{flex:1;border:0;border-radius:14px;padding:16px 8px;font-size:24px;font-weight:900;color:white;background:#2f80ed}
#start{font-size:15px;background:#22a06b}
small{color:#aab4c3;text-align:center}
</style>
</head>
<body><main>
<header><span>🏎 MINI RACER</span><span>Очки: <b id="score">0</b></span></header>
<canvas id="c" width="420" height="680"></canvas>
<div class="controls"><button id="l">◀</button><button id="start">СТАРТ / ЗАНОВО</button><button id="r">▶</button></div>
<small>Уворачивайся от машин! Управление: кнопки или ← →</small>
</main>
<script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),S=document.getElementById('score');
const W=420,H=680,L=54,R=366,lw=(R-L)/3;let lane=1,traffic=[],score=0,speed=4,offset=0,run=false,crash=false,spawn=0,last=0;
function drawCar(px,py,col,player=false){x.fillStyle=col;x.fillRect(px+5,py+8,38,66);x.fillStyle='#10151c';x.fillRect(px,py+18,8,18);x.fillRect(px+42,py+18,8,18);x.fillRect(px,py+48,8,18);x.fillRect(px+42,py+48,8,18);x.fillStyle=player?'#bce7ff':'#d9e3ee';x.fillRect(px+12,py+17,24,17);x.fillStyle='#26384b';x.fillRect(px+12,py+48,24,13);x.fillStyle='#fff2a6';x.fillRect(px+9,py+5,10,5);x.fillRect(px+31,py+5,10,5)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#24613d';x.fillRect(0,0,W,H);x.fillStyle='#343a43';x.fillRect(L,0,R-L,H);x.fillStyle='#eee';x.fillRect(L+5,0,4,H);x.fillRect(R-9,0,4,H);x.strokeStyle='#d2d6dc';x.lineWidth=4;x.setLineDash([34,30]);x.lineDashOffset=-offset;for(let i=1;i<3;i++){x.beginPath();x.moveTo(L+i*lw,0);x.lineTo(L+i*lw,H);x.stroke()}x.setLineDash([]);traffic.forEach(t=>drawCar(t.px,t.y,t.col));drawCar(L+lane*lw+(lw-48)/2,550,'#e83d4f',true);
if(!run){x.fillStyle='rgba(0,0,0,.62)';x.fillRect(70,250,280,155);x.textAlign='center';x.fillStyle='white';x.font='bold 29px system-ui';x.fillText(crash?'АВАРИЯ!':'MINI RACER',210,300);x.font='18px system-ui';x.fillText('Нажми СТАРТ',210,340);if(crash){x.font='16px system-ui';x.fillText('Очки: '+score,210,372)}}}
function reset(){lane=1;traffic=[];score=0;speed=4;offset=0;spawn=0;crash=false;run=true;S.textContent=0}
function move(d){if(run)lane=Math.max(0,Math.min(2,lane+d))}
document.getElementById('l').onpointerdown=e=>{e.preventDefault();move(-1)};document.getElementById('r').onpointerdown=e=>{e.preventDefault();move(1)};document.getElementById('start').onclick=reset;
onkeydown=e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key===' '&&!run)reset()};
function loop(t){let dt=Math.min((t-last)/16.67||1,2.5);last=t;if(run){offset=(offset+speed*dt)%64;spawn+=dt;if(spawn>Math.max(28,72-score/18)){spawn=0;let ln=Math.floor(Math.random()*3);traffic.push({lane:ln,px:L+ln*lw+(lw-48)/2,y:-100,col:['#f39c35','#5d9cec','#a66be0','#e9edf2'][Math.random()*4|0]})}traffic.forEach(a=>a.y+=(speed+score/250)*dt);for(let a of traffic)if(a.lane===lane&&a.y+74>558&&a.y<624){run=false;crash=true;break}traffic=traffic.filter(a=>{if(a.y>H){score+=10;S.textContent=score;return false}return true});speed=Math.min(9,4+score/250)}draw();requestAnimationFrame(loop)}
draw();requestAnimationFrame(loop)})();
</script></body></html>
